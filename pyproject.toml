[project]
name = "studylife-discord"
dynamic = ["version"]
description = "Discord bot for StudyLife: slash commands plus automatic session-start/end channel announcements via StudyLife's webhook system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pynacl>=1.5",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    # Starlette 1.6 deprecates its TestClient over httpx and warns on every test run until
    # httpx2 is installed.
    "httpx2>=2.12",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/studylife_discord/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/studylife_discord"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["studylife_discord"]
