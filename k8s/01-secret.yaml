# All values below are placeholders - even while this repo stays private, real values must
# never be committed (matches studylife-alexa's convention, kept ready for the day this repo
# goes public). Fill in directly with kubectl, never via git.
#
# DISCORD_PUBLIC_KEY/DISCORD_APPLICATION_ID aren't cryptographically secret (Discord shows
# both in its own public Developer Portal UI, and the public key's whole purpose is public
# verification - see verify.py), but are kept here rather than a ConfigMap anyway since
# there's no other non-secret runtime setting in this bot worth a separate ConfigMap for.
#
# DISCORD_BOT_TOKEN genuinely is secret: it authenticates every outgoing call to Discord's
# REST API (posting announcements, registering commands).
#
# STUDYLIFE_API_KEY is the single StudyLife account this bot acts on - obtained once locally
# via `python -m studylife_discord.login <instance-url>` (see README.md), never generated
# in-cluster.
#
# STUDYLIFE_WEBHOOK_SECRET is the HMAC secret StudyLife signs each webhook delivery with -
# only needed if the timer.started/timer.ended announcement feature is enabled.
#
# Bootstrap-only, NOT Flux-managed - kustomize-controller's ClusterRole (studylife repo's
# k8s/flux/06-reconciler-rbac.yaml) grants no permission on the "secrets" resource at all.
# Applied once by hand (kubectl apply -f k8s/01-secret.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: studylife-discord-secrets
  namespace: studylife-discord
type: Opaque
stringData:
  DISCORD_PUBLIC_KEY: "REPLACE-ME"
  DISCORD_BOT_TOKEN: "REPLACE-ME"
  DISCORD_APPLICATION_ID: "REPLACE-ME"
  DISCORD_ANNOUNCE_CHANNEL_ID: "REPLACE-ME"
  STUDYLIFE_BASE_URL: "REPLACE-ME"
  STUDYLIFE_API_KEY: "REPLACE-ME"
  STUDYLIFE_WEBHOOK_SECRET: "REPLACE-ME"
